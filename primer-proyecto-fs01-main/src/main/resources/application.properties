# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS SQLITE (para Docker)
# ============================================================================
spring.datasource.url=jdbc:sqlite:/app/data/usuarios.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ddl-auto=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Configuraciones adicionales para MySQL
# Manejo de zona horaria
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Configuración de pool de conexiones (opcional pero recomendado)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Spring Security está deshabilitado en: src/main/java/com/primerproyecto/api/config/SecurityConfig.java