# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ============================================================================
# Configuración para MySQL (cambiar según tu instalación)

# URL de conexión MySQL:
# jdbc:mysql://localhost:3306/nombre_base_datos?createDatabaseIfNotExist=true
# - localhost:3306 = servidor MySQL en puerto 3306
# - nombre_base_datos = nombre de tu BD (ej: primer_proyecto)
# - createDatabaseIfNotExist=true = crea la BD si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/primer_proyecto?createDatabaseIfNotExist=true

# Driver JDBC para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credenciales de MySQL (cambiar según tu instalación)
spring.datasource.username=springuser
spring.datasource.password=password123

# ============================================================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================================================
# Hibernate es el ORM (Object-Relational Mapping) que convierte:
# Objetos Java ↔ Tablas SQL

# ddl-auto=update: Qué hacer con las tablas al iniciar?
# - validate: solo verifica que existan (no crea ni modifica)
# - create:   borra todo y crea nuevo (PELIGROSO en producción)
# - create-drop: crea al iniciar, borra al apagar (para tests)
# - update:   RECOMENDADO en desarrollo - crea si no existen, no borra
# - none:     no hace nada (manual)
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: Muestra en consola todas las queries SQL generadas
# Útil para aprender qué SQL genera Hibernate
# En producción lo pones en false para evitar logs enormes
spring.jpa.show-sql=true

# Dialecto para MySQL
# Le dice a Hibernate "estamos usando MySQL, genera SQL compatible con esto"
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuraciones adicionales para MySQL
# Manejo de zona horaria
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Configuración de pool de conexiones (opcional pero recomendado)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Spring Security está deshabilitado en: src/main/java/com/primerproyecto/api/config/SecurityConfig.java